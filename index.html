<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>VALORANT Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Arial Black', sans-serif;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
    }

    #toggle-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10000;
      background: #ff4655;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #admin-panel {
      position: fixed;
      top: 45px;
      left: 10px;
      z-index: 9999;
      background: rgba(15, 25, 35, 0.95);
      border: 2px solid #ff4655;
      padding: 15px;
      border-radius: 8px;
      color: white;
      max-height: 85vh;
      overflow-y: auto;
      width: 360px;
      font-family: sans-serif;
    }

    .panel-hidden { display: none !important; }

    .team-title {
      font-size: 13px;
      font-weight: bold;
      padding: 6px 8px;
      margin: 12px 0 6px 0;
      border-radius: 4px;
    }
    .blue-team-title { background: #00b4d8; color: white; }
    .map-title { background: #ffb142; color: #111; }
    .red-team-title { background: #ff4655; color: white; }
    .sheet-title { background: #2ecc71; color: #111; }

    .team-info-box {
      background: rgba(255,255,255,0.08);
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.05);
      padding: 6px;
      border-radius: 4px;
    }

    .player-row-inputs { display: flex; gap: 5px; }
    .player-label { font-size: 11px; font-weight: bold; }

    input[type="text"], select {
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid #364966;
      background: #111c24;
      color: white;
      font-size: 12px;
      width: 100%;
      box-sizing: border-box;
    }

    .btn-action {
      background: #2ecc71;
      color: #111;
      font-weight: bold;
      border: none;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 4px;
    }

    /* --- OVERLAY CANVAS (1920x1080) --- */
    #overlay-container {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    /* チームバナー位置 */
    .team-banner {
      position: absolute;
      top: 725px;
      width: 320px;
      height: 55px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      box-sizing: border-box;
      gap: 12px;
    }

    #team-banner-blue { left: 0px; justify-content: flex-start; }
    #team-banner-red { left: 1600px; justify-content: flex-end; flex-direction: row-reverse; }

    .team-logo-img {
      height: 45px;
      width: 45px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    .team-banner-name {
      color: white;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
    }

    /* 真ん中の黒の上の紫（GAME 1 表示） */
    #game-title-display {
      position: absolute;
      left: 880px;
      top: 780px;
      width: 160px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
    }

    /* 真ん中の黒枠（マップ画像） */
    #map-item {
      position: absolute;
      left: 800px;
      top: 852px;
      width: 320px;
      height: 166px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .map-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 最下部の紫枠（マップ名表示） */
    #map-name-display {
      position: absolute;
      left: 800px;
      top: 1018px;
      width: 320px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
    }

    /* 白い枠（キャラ表示エリア） */
    .player-item {
      position: absolute;
      top: 852px;
      width: 160px;
      height: 166px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .agent-img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.7));
    }

    /* 最下部の紫枠（各プレイヤー名表示） */
    .player-name-container {
      position: absolute;
      top: 1018px;
      width: 160px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-name {
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      padding: 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
    }

    /* 左5枠 (BLUE) */
    #item-blue-1, #name-container-blue-1 { left: 0px; }
    #item-blue-2, #name-container-blue-2 { left: 160px; }
    #item-blue-3, #name-container-blue-3 { left: 320px; }
    #item-blue-4, #name-container-blue-4 { left: 480px; }
    #item-blue-5, #name-container-blue-5 { left: 640px; }

    /* 右5枠 (RED) */
    #item-red-1, #name-container-red-1 { left: 1120px; }
    #item-red-2, #name-container-red-2 { left: 1280px; }
    #item-red-3, #name-container-red-3 { left: 1440px; }
    #item-red-4, #name-container-red-4 { left: 1600px; }
    #item-red-5, #name-container-red-5 { left: 1760px; }
  </style>
</head>
<body>

  <button id="toggle-btn" onclick="togglePanel()">⚙️ 管理パネル 開閉</button>

  <div id="admin-panel">
    <h3 style="margin: 0 0 10px 0; color: #ff4655; font-size: 15px;">大会オーバーレイ管理</h3>

    <!-- Googleスプレッドシート自動連動 -->
    <div class="team-title sheet-title">📊 Googleスプレッドシート連携</div>
    <div class="team-info-box">
      <input type="text" id="sheet-id-input" placeholder="スプレッドシートIDを入力">
      <button class="btn-action" onclick="fetchSheetData()">データ読み込み</button>
    </div>

    <!-- 青チーム -->
    <div class="team-title blue-team-title">BLUE TEAM (左側)</div>
    <div class="team-info-box">
      <select id="select-team-blue-preset" onchange="applyTeamPreset('blue')">
        <option value="">-- シートからチームを選択 --</option>
      </select>
      <input type="text" id="team-blue-name-input" value="TEAM BLUE" oninput="sendState()" placeholder="チーム名 (手入力可)">
      <input type="text" id="team-blue-logo-input" value="" oninput="sendState()" placeholder="ロゴ画像名 (例: team_a.png)">
    </div>
    <div id="blue-controls"></div>

    <!-- マップ & Game表示 -->
    <div class="team-title map-title">MAP & GAME INFO</div>
    <div class="team-info-box">
      <input type="text" id="game-title-input" value="GAME 1" oninput="sendState()" placeholder="表記 (例: GAME 1, FINAL)">
      <select id="map-select" onchange="sendState()"></select>
    </div>

    <!-- 赤チーム -->
    <div class="team-title red-team-title">RED TEAM (右側)</div>
    <div class="team-info-box">
      <select id="select-team-red-preset" onchange="applyTeamPreset('red')">
        <option value="">-- シートからチームを選択 --</option>
      </select>
      <input type="text" id="team-red-name-input" value="TEAM RED" oninput="sendState()" placeholder="チーム名 (手入力可)">
      <input type="text" id="team-red-logo-input" value="" oninput="sendState()" placeholder="ロゴ画像名 (例: team_b.png)">
    </div>
    <div id="red-controls"></div>
  </div>

  <div id="overlay-container">
    <div id="team-banner-blue" class="team-banner">
      <img id="team-blue-logo-img" class="team-logo-img" src="" style="display:none;">
      <div id="team-blue-name" class="team-banner-name">TEAM BLUE</div>
    </div>

    <div id="team-banner-red" class="team-banner">
      <img id="team-red-logo-img" class="team-logo-img" src="" style="display:none;">
      <div id="team-red-name" class="team-banner-name">TEAM RED</div>
    </div>

    <div id="game-title-display">GAME 1</div>

    <div id="map-item">
      <img id="map-img-display" class="map-img" src="images/ascent.png" alt="map">
    </div>

    <div id="map-name-display">ASCENT</div>

    <div id="blue-items"></div>
    <div id="red-items"></div>
  </div>

  <script>
    const maps = [
      { id: "ascent", name: "アセント (Ascent)" },
      { id: "haven", name: "ヘイブン (Haven)" },
      { id: "sunset", name: "サンセット (Sunset)" },
      { id: "breeze", name: "ブリーズ (Breeze)" },
      { id: "split", name: "スプリット (Split)" },
      { id: "lotus", name: "ロータス (Lotus)" },
      { id: "summit", name: "サミット (Summit)" }
    ];

    const agents = [
      { category: "デュエリスト", list: [
        { id: "jett", name: "ジェット" }, { id: "phoenix", name: "フェニックス" },
        { id: "reyna", name: "レイナ" }, { id: "raze", name: "レイズ" },
        { id: "yoru", name: "ヨル" }, { id: "neon", name: "ネオン" },
        { id: "iso", name: "アイソ" }, { id: "waylay", name: "ウェイレイ" }
      ]},
      { category: "イニシエーター", list: [
        { id: "sova", name: "ソーヴァ" }, { id: "breach", name: "ブリーチ" },
        { id: "skye", name: "スカイ" }, { id: "kayo", name: "KAY/O" },
        { id: "fade", name: "フェイド" }, { id: "gekko", name: "ゲッコー" },
        { id: "tejo", name: "テホ" }
      ]},
      { category: "コントローラー", list: [
        { id: "brimstone", name: "ブリムストーン" }, { id: "omen", name: "オーメン" },
        { id: "viper", name: "ヴァイパー" }, { id: "astra", name: "アストラ" },
        { id: "harbor", name: "ハーバー" }, { id: "clove", name: "クローヴ" },
        { id: "mix", name: "ミクス" }
      ]},
      { category: "センチネル", list: [
        { id: "sage", name: "セージ" }, { id: "cypher", name: "サイファー" },
        { id: "killjoy", name: "キルジョイ" }, { id: "chamber", name: "チェンバー" },
        { id: "deadlock", name: "デッドロック" }, { id: "vyse", name: "ヴァイス" },
        { id: "vito", name: "ヴィトー" }
      ]}
    ];

    const TOPIC_URL = "https://ntfy.sh/josefu_val_overlay_2026_secret";
    let loadedTeamsData = [];

    function createAgentSelectHTML(id) {
      let html = `<select id="select-agent-${id}" onchange="sendState()">`;
      agents.forEach(group => {
        html += `<optgroup label="${group.category}">`;
        group.list.forEach(a => {
          html += `<option value="${a.id}">${a.name}</option>`;
        });
        html += `</optgroup>`;
      });
      html += `</select>`;
      return html;
    }

    function initMapSelect() {
      const mapSelect = document.getElementById('map-select');
      let html = '';
      maps.forEach(m => {
        html += `<option value="${m.id}">${m.name}</option>`;
      });
      mapSelect.innerHTML = html;
    }

    function init() {
      initMapSelect();

      const blueCtrl = document.getElementById('blue-controls');
      const redCtrl = document.getElementById('red-controls');
      const blueItems = document.getElementById('blue-items');
      const redItems = document.getElementById('red-items');

      for (let i = 1; i <= 5; i++) {
        const id = `blue-${i}`;
        const defaultName = `Player ${i}`;
        
        blueCtrl.innerHTML += `
          <div class="player-row">
            <span class="player-label" style="color:#00b4d8;">BLUE Player ${i}</span>
            <div class="player-row-inputs">
              <select id="select-player-${id}" onchange="sendState()">
                <option value="${defaultName}">${defaultName}</option>
              </select>
              ${createAgentSelectHTML(id)}
            </div>
          </div>`;

        blueItems.innerHTML += `
          <div class="player-item" id="item-${id}">
            <img id="img-${id}" class="agent-img" src="images/jett.png" alt="agent">
          </div>
          <div class="player-name-container" id="name-container-${id}">
            <div id="name-${id}" class="player-name">${defaultName}</div>
          </div>`;
      }

      for (let i = 1; i <= 5; i++) {
        const id = `red-${i}`;
        const defaultName = `Player ${i}`;

        redCtrl.innerHTML += `
          <div class="player-row">
            <span class="player-label" style="color:#ff4655;">RED Player ${i}</span>
            <div class="player-row-inputs">
              <select id="select-player-${id}" onchange="sendState()">
                <option value="${defaultName}">${defaultName}</option>
              </select>
              ${createAgentSelectHTML(id)}
            </div>
          </div>`;

        redItems.innerHTML += `
          <div class="player-item" id="item-${id}">
            <img id="img-${id}" class="agent-img" src="images/jett.png" alt="agent">
          </div>
          <div class="player-name-container" id="name-container-${id}">
            <div id="name-${id}" class="player-name">${defaultName}</div>
          </div>`;
      }

      const isOBS = window.location.search.includes('obs');
      if (isOBS) {
        document.getElementById('admin-panel').classList.add('panel-hidden');
        document.getElementById('toggle-btn').style.display = 'none';
      }

      listenForUpdates();
    }

    function fetchSheetData() {
      const sheetId = document.getElementById('sheet-id-input').value.trim();
      if (!sheetId) {
        alert("スプレッドシートIDを入力してください");
        return;
      }

      const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

      fetch(url)
        .then(res => res.text())
        .then(text => {
          const json = JSON.parse(text.substr(47).slice(0, -2));
          const rows = json.table.rows;
          loadedTeamsData = [];

          rows.forEach(row => {
            if (!row.c || !row.c[0]) return;
            const teamName = row.c[0] ? row.c[0].v : "";
            
            const players = [];
            for (let col = 1; col < row.c.length; col++) {
              if (row.c[col] && row.c[col].v) {
                players.push(row.c[col].v);
              }
            }

            if (teamName) {
              loadedTeamsData.push({
                teamName: teamName,
                players: players
              });
            }
          });

          updateTeamDropdowns();
          alert(`${loadedTeamsData.length} 件のチーム情報を読み込みました！`);
        })
        .catch(err => {
          console.error(err);
          alert("データの取得に失敗しました。スプレッドシートのアクセス権を確認してください。");
        });
    }

    function updateTeamDropdowns() {
      ['blue', 'red'].forEach(side => {
        const select = document.getElementById(`select-team-${side}-preset`);
        select.innerHTML = '<option value="">-- シートからチームを選択 --</option>';
        loadedTeamsData.forEach((t, idx) => {
          select.innerHTML += `<option value="${idx}">${t.teamName}</option>`;
        });
      });
    }

    function applyTeamPreset(side) {
      const select = document.getElementById(`select-team-${side}-preset`);
      const idx = select.value;
      if (idx === "") return;

      const team = loadedTeamsData[idx];
      document.getElementById(`team-${side}-name-input`).value = team.teamName;

      for (let i = 1; i <= 5; i++) {
        const playerSelect = document.getElementById(`select-player-${side}-${i}`);
        if (playerSelect) {
          let optionsHtml = '';
          team.players.forEach(p => {
            optionsHtml += `<option value="${p}">${p}</option>`;
          });
          playerSelect.innerHTML = optionsHtml;
          
          if (team.players[i - 1]) {
            playerSelect.value = team.players[i - 1];
          }
        }
      }

      sendState();
    }

    function renderUI(data) {
      if (!data) return;

      if (data.gameTitle !== undefined) {
        document.getElementById('game-title-input').value = data.gameTitle;
        document.getElementById('game-title-display').innerText = data.gameTitle;
      }

      if (data.teams) {
        if (data.teams.blue) {
          document.getElementById('team-blue-name-input').value = data.teams.blue.name;
          document.getElementById('team-blue-name').innerText = data.teams.blue.name;
          
          const blueLogoImg = document.getElementById('team-blue-logo-img');
          if (data.teams.blue.logo) {
            blueLogoImg.src = `images/${data.teams.blue.logo}`;
            blueLogoImg.style.display = 'block';
          } else {
            blueLogoImg.style.display = 'none';
          }
        }

        if (data.teams.red) {
          document.getElementById('team-red-name-input').value = data.teams.red.name;
          document.getElementById('team-red-name').innerText = data.teams.red.name;

          const redLogoImg = document.getElementById('team-red-logo-img');
          if (data.teams.red.logo) {
            redLogoImg.src = `images/${data.teams.red.logo}`;
            redLogoImg.style.display = 'block';
          } else {
            redLogoImg.style.display = 'none';
          }
        }
      }

      if (data.map) {
        document.getElementById('map-select').value = data.map;
        document.getElementById('map-img-display').src = `images/${data.map}.png`;
        document.getElementById('map-name-display').innerText = data.map.toUpperCase();
      }

      if (data.players) {
        Object.keys(data.players).forEach(id => {
          const p = data.players[id];
          const pSelect = document.getElementById(`select-player-${id}`);
          if (pSelect) {
            if (!Array.from(pSelect.options).some(opt => opt.value === p.name)) {
              pSelect.innerHTML += `<option value="${p.name}">${p.name}</option>`;
            }
            pSelect.value = p.name;
            document.getElementById(`select-agent-${id}`).value = p.agent;
            document.getElementById(`name-${id}`).innerText = p.name;
            document.getElementById(`img-${id}`).src = `images/${p.agent}.png`;
          }
        });
      }
    }

    let sendTimer = null;
    function sendState() {
      const gameTitle = document.getElementById('game-title-input').value;
      document.getElementById('game-title-display').innerText = gameTitle;

      const blueName = document.getElementById('team-blue-name-input').value;
      const blueLogo = document.getElementById('team-blue-logo-input').value;
      const redName = document.getElementById('team-red-name-input').value;
      const redLogo = document.getElementById('team-red-logo-input').value;

      document.getElementById('team-blue-name').innerText = blueName;
      document.getElementById('team-red-name').innerText = redName;

      const blueLogoImg = document.getElementById('team-blue-logo-img');
      if (blueLogo) {
        blueLogoImg.src = `images/${blueLogo}`;
        blueLogoImg.style.display = 'block';
      } else {
        blueLogoImg.style.display = 'none';
      }

      const redLogoImg = document.getElementById('team-red-logo-img');
      if (redLogo) {
        redLogoImg.src = `images/${redLogo}`;
        redLogoImg.style.display = 'block';
      } else {
        redLogoImg.style.display = 'none';
      }

      const mapVal = document.getElementById('map-select').value;
      document.getElementById('map-img-display').src = `images/${mapVal}.png`;
      document.getElementById('map-name-display').innerText = mapVal.toUpperCase();

      for (let i = 1; i <= 5; i++) {
        ['blue', 'red'].forEach(team => {
          const id = `${team}-${i}`;
          const selectedPlayer = document.getElementById(`select-player-${id}`).value;
          const selectAgent = document.getElementById(`select-agent-${id}`).value;
          document.getElementById(`name-${id}`).innerText = selectedPlayer;
          document.getElementById(`img-${id}`).src = `images/${selectAgent}.png`;
        });
      }

      clearTimeout(sendTimer);
      sendTimer = setTimeout(() => {
        const data = {
          gameTitle: gameTitle,
          teams: {
            blue: { name: blueName, logo: blueLogo },
            red: { name: redName, logo: redLogo }
          },
          map: mapVal,
          players: {}
        };

        for (let i = 1; i <= 5; i++) {
          ['blue', 'red'].forEach(team => {
            const id = `${team}-${i}`;
            data.players[id] = {
              name: document.getElementById(`select-player-${id}`).value,
              agent: document.getElementById(`select-agent-${id}`).value
            };
          });
        }

        fetch(TOPIC_URL, {
          method: 'POST',
          body: JSON.stringify(data)
        }).catch(err => console.error("送信エラー:", err));
      }, 100);
    }

    function listenForUpdates() {
      const eventSource = new EventSource(TOPIC_URL + "/sse");
      eventSource.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          if (message && message.message) {
            const data = JSON.parse(message.message);
            renderUI(data);
          }
        } catch (e) {}
      };
    }

    function togglePanel() {
      const panel = document.getElementById('admin-panel');
      panel.classList.toggle('panel-hidden');
    }

    window.onload = init;
  </script>
</body>
</html>
